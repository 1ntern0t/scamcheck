# GitHub Actions workflow for scamcheck.
# Kept under ci/ because the publishing token lacked the `workflow` scope.
# To enable: copy this file to .github/workflows/ci.yml.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Static page is up to date
        run: node scripts/build-web.js && git diff --exit-code docs/index.html
