# GitHub Actions workflow for scamcheck.
# Runs npm test on Node 20 and 22, then checks that docs/index.html is current.
# checkout and setup-node are v5: v4 still declares the Node 20 action runtime,
# which GitHub-hosted runners removed on 2026-09-23. v5 is the oldest major on Node 24.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Static page is up to date
        run: node scripts/build-web.js && git diff --exit-code docs/index.html
